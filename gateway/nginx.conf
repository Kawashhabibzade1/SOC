# ─────────────────────────────────────────────
# SOC Radar - nginx Reverse Proxy
# nginx.conf
#
# Terminates TLS using Tailscale-issued certificates,
# then forwards traffic to the soc-gateway container on port 3001.
#
# Tailscale cert files are expected at:
#   /etc/nginx/certs/heimserver.tail2ad9cd.ts.net.crt
#   /etc/nginx/certs/heimserver.tail2ad9cd.ts.net.key
#
# Generate them on the host with:
#   sudo tailscale cert heimserver.tail2ad9cd.ts.net
# ─────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {

  # ── Redirect plain HTTP → HTTPS ──────────────────────────────────────────
  server {
    listen 80;
    server_name heimserver.tail2ad9cd.ts.net;

    return 301 https://$host$request_uri;
  }

  # ── HTTPS frontend → gateway proxy ───────────────────────────────────────
  server {
    listen 443 ssl;
    server_name heimserver.tail2ad9cd.ts.net;

    # Tailscale TLS certificate (mounted from host)
    ssl_certificate     /etc/nginx/certs/heimserver.tail2ad9cd.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/heimserver.tail2ad9cd.ts.net.key;

    # Modern TLS settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Proxy to soc-gateway ─────────────────────────────────────────────
    location / {
      proxy_pass         http://soc-gateway:3001;
      proxy_http_version 1.1;

      # Required for WebSocket / Socket.io
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Standard proxy headers
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Timeouts generous enough for long-polling / WebSocket
      proxy_read_timeout  86400s;
      proxy_send_timeout  86400s;
      proxy_connect_timeout 10s;
    }
  }
}
