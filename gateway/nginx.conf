events {
  worker_connections 1024;
}

http {
  # ── HTTP Server (LAN Access via IP) ───────────────────────────────────────
  server {
    listen 80;
    server_name 192.168.0.193 localhost;

    # API goes to gateway
    location /api/ {
      proxy_pass         http://192.168.0.193:3001/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets go to gateway
    location /socket.io/ {
      proxy_pass         http://192.168.0.193:3001/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Everything else goes to frontend
    location / {
      proxy_pass         http://192.168.0.193:3000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── Redirect Tailscale HTTP → HTTPS ──────────────────────────────────────
  server {
    listen 80;
    server_name heimserver.tail2ad9cd.ts.net;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS Server (Tailscale Access) ──────────────────────────────────────
  server {
    listen 443 ssl;
    server_name heimserver.tail2ad9cd.ts.net;

    ssl_certificate     /etc/nginx/certs/heimserver.tail2ad9cd.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/heimserver.tail2ad9cd.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # API goes to gateway
    location /api/ {
      proxy_pass         http://192.168.0.193:3001/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets go to gateway
    location /socket.io/ {
      proxy_pass         http://192.168.0.193:3001/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Everything else goes to frontend
    location / {
      proxy_pass         http://192.168.0.193:3000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
