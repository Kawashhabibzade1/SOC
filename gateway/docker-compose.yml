# ─────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────
networks:

  # The network your existing nextcloud-db container is already attached to.
  mariadb-net:
    external: true
    name: nextcloud_default       # ← CHANGE THIS if your network name differs

  # Isolated internal network for SOC services (nginx ↔ gateway)
  soc-internal:
    driver: bridge
    name: soc-internal
