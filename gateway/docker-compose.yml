# ─────────────────────────────────────────────
# SOC Radar - Phase 2 Gateway + nginx HTTPS proxy
# docker-compose.yml
#
# IMPORTANT — Before running:
# 1. Get your Tailscale TLS certificate on the host:
#      sudo tailscale cert heimserver.tail2ad9cd.ts.net
#    This creates two files (default location: current directory or /etc/tailscale/):
#      heimserver.tail2ad9cd.ts.net.crt
#      heimserver.tail2ad9cd.ts.net.key
#    Copy them to:
#      /opt/soc/certs/heimserver.tail2ad9cd.ts.net.crt
#      /opt/soc/certs/heimserver.tail2ad9cd.ts.net.key
#
# 2. Find the name of your existing MariaDB Docker network:
#      docker inspect nextcloud-db --format '{{json .NetworkSettings.Networks}}'
#    Set MARIADB_NETWORK if different from 'nextcloud_default'.
#
# 3. Run:
#      docker compose up -d --build
# ─────────────────────────────────────────────

services:

  # ── nginx: TLS termination + reverse proxy ───────────────────────────────
  soc-nginx:
    image: nginx:1.27-alpine
    container_name: soc-nginx
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP  → redirects to HTTPS
      - "443:443"     # HTTPS → proxied to soc-gateway:3001
    volumes:
      # nginx config (read-only)
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Tailscale TLS certificates from host (read-only)
      - ./certs:/etc/nginx/certs:ro
    networks:
      - soc-internal
    depends_on:
      - soc-gateway
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── soc-gateway: Node.js REST + Socket.io ───────────────────────────────
  soc-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-gateway
    restart: unless-stopped
    # Port 3001 is no longer exposed to the host — only reachable via nginx
    expose:
      - "3001"
    env_file:
      - .env
    volumes:
      - /tmp/soc_active_sessions.json:/tmp/soc_active_sessions.json:ro
      - /tmp/soc_open_ports.json:/tmp/soc_open_ports.json:ro
      - /tmp/soc_tailscale.json:/tmp/soc_tailscale.json:ro
      - /tmp/soc_lan_devices.json:/tmp/soc_lan_devices.json:ro
      - /tmp/soc_network_traffic.json:/tmp/soc_network_traffic.json:ro
      - /tmp/soc_cve_scan.json:/tmp/soc_cve_scan.json:ro
      - /tmp:/host_tmp
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # 1. Join the existing MariaDB network so we can reach 'nextcloud-db' by hostname
      - mariadb-net
      # 2. Internal SOC network (shared with nginx)
      - soc-internal
    # depends_on:
    #   nextcloud-db:
    #     condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

#  # ── Reference to the EXISTING MariaDB container ──────────────────────────
#  # Declared here only so 'depends_on' and the healthcheck work.
#  nextcloud-db:
